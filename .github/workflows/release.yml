name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ensure tag points to main HEAD
        run: |
          git fetch origin main --depth=1
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF}^{}")
          MAIN_HEAD=$(git rev-parse origin/main)
          if [ "$TAG_COMMIT" != "$MAIN_HEAD" ]; then
            echo "Tag does not point to main HEAD. Refusing to publish."
            exit 1
          fi

      - name: Publish to npm (preflight + publish)
        run: ./scripts/release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Checkout main for version sync
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync version on main branch
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore: sync version with tag ${GITHUB_REF_NAME}"
          git push origin HEAD:main
